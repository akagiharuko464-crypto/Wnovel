<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Empire | Ad-Official</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
        body.dark-mode { --bg: #020617; --card: #111827; --text: #f8fafc; --border: #1e293b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        
        /* Popup UI */
        .daily-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .daily-card { background: var(--card); width: 85%; padding: 30px; border-radius: 30px; text-align: center; border: 1px solid var(--border); animation: pop 0.4s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn-primary { background: var(--primary); color: white; width: 100%; padding: 16px; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: var(--card); display: flex; padding: 15px 0; border-top: 1px solid var(--border); }
        .nav-item { flex: 1; text-align: center; font-size: 10px; font-weight: 800; color: #94a3b8; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .search-bar { width: 100%; padding: 14px; border-radius: 50px; border: 1px solid var(--border); background: var(--card); color: var(--text); margin-bottom: 20px; outline: none; }
        .novel-item { display: flex; gap: 15px; background: var(--card); padding: 12px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); }
        .novel-item img { width: 70px; height: 100px; border-radius: 12px; object-fit: cover; }
    </style>
</head>
<body>

<div id="dailyOverlay" class="daily-overlay">
    <div class="daily-card">
        <h1 style="font-size: 50px; margin: 0;">💎</h1>
        <h2>Daily Spirit Gift</h2>
        <p style="opacity: 0.7;">Receive your daily cultivation resources.</p>
        <button onclick="claimStandard()" class="btn-primary" style="background: #64748b;">Claim 20 Stones</button>
        <button onclick="claimDouble()" class="btn-primary" style="background: linear-gradient(45deg, #f59e0b, #ef4444);">Double to 40 (Ad) ✨</button>
    </div>
</div>

<div class="container">
    <div id="home" class="section active">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h1 style="margin:0;">Sovereign</h1>
            <span onclick="toggleSearch()" style="cursor:pointer; font-size: 20px;">🔍</span>
        </div>
        <input type="text" id="searchInput" class="search-bar" style="display:none;" placeholder="Search worlds..." onkeyup="runSearch()">
        <div id="novelList"></div>
    </div>
    
    <div id="settings" class="section" style="display:none; text-align: center;">
        <div class="daily-card" style="width: 100%; margin-bottom: 20px;">
            <img id="userPfp" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary);">
            <h3 id="profName">Cultivator</h3>
            <div style="display:flex; justify-content: space-around;">
                <div><small>Stones</small><br><b id="statStones">0</b></div>
                <div><small>XP</small><br><b id="statXp">0</b></div>
            </div>
        </div>
        <button onclick="auth.signOut(); location.reload();" class="btn-primary" style="background:#ef4444;">LOGOUT</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showSec('home', this)">LIB</div>
    <div class="nav-item" onclick="showSec('settings', this)">PROF</div>
</nav>

<script>
    // Configs
    const REWARDED_AD_UNIT = "ca-app-pub-8691102556824057/4170900635";
    const firebaseConfig = {
      apiKey: "AIzaSyBz0refxUq767lr0pYXbXBG6Ns4RBG4eVs",
      authDomain: "wnovel-aaa99.firebaseapp.com",
      projectId: "wnovel-aaa99",
      storageBucket: "wnovel-aaa99.firebasestorage.app",
      messagingSenderId: "476794649269",
      appId: "1:476794649269:web:ffc69d8f26849d30f9dcfc"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                const d = doc.data() || {};
                document.getElementById('statStones').innerText = d.stones || 0;
                document.getElementById('statXp').innerText = d.xp || 0;
                document.getElementById('profName').innerText = d.name || "Cultivator";
                document.getElementById('userPfp').src = d.pfp || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`;
                checkDaily();
            });
            loadNovels();
        } else {
            // Simple Auth for demo
            auth.signInAnonymously();
        }
    });

    function checkDaily() {
        const last = localStorage.getItem('lastDaily');
        if(last !== new Date().toDateString()) {
            document.getElementById('dailyOverlay').style.display = "flex";
        }
    }

    async function claimStandard() {
        await addStones(20);
        finishDaily();
    }

    async function claimDouble() {
        // Simulating the Rewarded Ad call
        console.log("Calling Ad Unit: " + REWARDED_AD_UNIT);
        alert("Loading Rewarded Vision...");
        setTimeout(async () => {
            await addStones(40);
            finishDaily();
            alert("✨ 40 Spirit Stones Added!");
        }, 2000);
    }

    async function addStones(amt) {
        await db.collection("users").doc(auth.currentUser.uid).update({
            stones: firebase.firestore.FieldValue.increment(amt),
            xp: firebase.firestore.FieldValue.increment(amt / 2)
        });
    }

    function finishDaily() {
        localStorage.setItem('lastDaily', new Date().toDateString());
        document.getElementById('dailyOverlay').style.display = "none";
    }

    function toggleSearch() {
        const s = document.getElementById('searchInput');
        s.style.display = s.style.display === 'none' ? 'block' : 'none';
    }

    function loadNovels() {
        db.collection("novels").onSnapshot(snap => {
            const list = document.getElementById('novelList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div class="novel-item"><img src="${d.url}"><div><h4>${d.title}</h4><p style="font-size:10px; opacity:0.6;">${d.synopsis}</p></div></div>`;
            });
        });
    }

    function showSec(id, el) {
        document.querySelectorAll('.section').forEach(s => s.style.display='none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).style.display='block';
        el.classList.add('active');
    }
</script>
</body>
    </html>
