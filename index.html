<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNovel Pro - Spirit Realm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .accent-gradient { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #1e293b; border-top: 1px solid #334155; z-index: 50; }
        .spin-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="pb-24">

    <header class="p-4 flex justify-between items-center glass sticky top-0 z-40">
        <h1 class="text-xl font-bold italic tracking-tighter text-blue-400">WNOVEL <span class="text-white">PRO</span></h1>
        <div id="user-info" class="flex items-center gap-3">
            <div class="flex items-center bg-slate-800 px-3 py-1 rounded-full border border-blue-500/30">
                <span class="text-yellow-400 mr-2">💎</span>
                <span id="stone-count" class="font-bold">0</span>
            </div>
            <button id="login-btn" class="text-sm bg-blue-600 px-4 py-1 rounded-md font-medium">Login</button>
            <img id="user-pfp" class="w-8 h-8 rounded-full hidden border-2 border-blue-400">
        </div>
    </header>

    <main id="app-content" class="p-4">
        
        <section id="spin-section" class="mb-8">
            <div class="glass rounded-2xl p-6 text-center">
                <h2 class="text-lg font-bold mb-2 text-blue-300">Daily Lucky Spin</h2>
                <p class="text-xs text-slate-400 mb-4">Cost: 5 Spirit Stones</p>
                <div id="wheel" class="text-6xl mb-6 transition-all duration-500">🎡</div>
                <button id="spin-trigger" class="spin-btn accent-gradient w-full py-3 rounded-xl font-bold shadow-lg">SPIN NOW</button>
            </div>
        </section>

        <section id="writer-section" class="hidden mb-8">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-1 rounded-2xl">
                <div class="bg-slate-900 rounded-2xl p-5">
                    <h2 class="font-bold text-blue-400 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib"></i> Author Tools
                    </h2>
                    <input type="text" id="novel-title" placeholder="Novel Title..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg mb-3 outline-none">
                    <textarea id="novel-synopsis" placeholder="Synopsys..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg mb-3 h-24 outline-none"></textarea>
                    <button id="publish-btn" class="w-full bg-emerald-600 py-2 rounded-lg font-bold">Publish Novel</button>
                </div>
            </div>
        </section>

        <div id="novel-feed" class="space-y-4">
            <p class="text-center text-slate-500 py-10">Sign in to start your cultivation journey...</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="flex flex-col items-center text-blue-400"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] mt-1">Library</span></button>
        <button class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-compass text-xl"></i><span class="text-[10px] mt-1">Explore</span></button>
        <button class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-book-open text-xl"></i><span class="text-[10px] mt-1">Write</span></button>
        <button class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-user text-xl"></i><span class="text-[10px] mt-1">Profile</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG MO (WNOVEL-AAA99)
        const firebaseConfig = {
            apiKey: "AIzaSyBz0refxUq767lr0pYXbXBG6Ns4RBG4eVs",
            authDomain: "wnovel-aaa99.firebaseapp.com",
            projectId: "wnovel-aaa99",
            storageBucket: "wnovel-aaa99.firebasestorage.app",
            messagingSenderId: "476794649269",
            appId: "1:476794649269:web:ffc69d8f26849d30f9dcfc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // LOGIN LOGIC
        document.getElementById('login-btn').addEventListener('click', async () => {
            if (!currentUser) {
                try {
                    const result = await signInWithPopup(auth, provider);
                    console.log("Logged in!");
                } catch (e) { alert("Login failed: " + e.message); }
            } else {
                await signOut(auth);
                location.reload();
            }
        });

        // AUTH LISTENER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-btn').innerText = "Logout";
                document.getElementById('user-pfp').src = user.photoURL;
                document.getElementById('user-pfp').classList.remove('hidden');
                document.getElementById('writer-section').classList.remove('hidden');
                
                // Load/Create User Profile
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    await setDoc(userRef, { stones: 100, name: user.displayName });
                }
                
                // Real-time stones update
                onSnapshot(userRef, (doc) => {
                    document.getElementById('stone-count').innerText = doc.data().stones || 0;
                });
                
                loadNovels();
            }
        });

        // LUCKY SPIN LOGIC
        document.getElementById('spin-trigger').addEventListener('click', async () => {
            if (!currentUser) return alert("Login muna, Cultivator!");
            
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            const stones = userSnap.data().stones;

            if (stones < 5) return alert("Kulang ang Spirit Stones mo!");

            const wheel = document.getElementById('wheel');
            wheel.classList.add('rotate-180');
            
            // Random rewards
            const rewards = [0, 2, 10, 20, 50, 5, 1];
            const prize = rewards[Math.floor(Math.random() * rewards.length)];

            setTimeout(async () => {
                await updateDoc(userRef, { stones: increment(prize - 5) });
                wheel.classList.remove('rotate-180');
                alert(`You got ${prize} Spirit Stones!`);
            }, 500);
        });

        // LOAD NOVELS
        function loadNovels() {
            const q = query(collection(db, "novels"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('novel-feed');
                feed.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    feed.innerHTML += `
                        <div class="glass p-4 rounded-xl flex gap-4">
                            <div class="w-20 h-28 bg-slate-700 rounded-md shadow-inner flex-shrink-0 flex items-center justify-center text-xs text-slate-500 italic">No Cover</div>
                            <div class="flex-1">
                                <h3 class="font-bold text-blue-400">${data.title}</h3>
                                <p class="text-xs text-slate-400 line-clamp-2 mt-1">${data.synopsis}</p>
                                <div class="mt-3 flex items-center justify-between">
                                    <span class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-500">Author: ${data.authorName}</span>
                                    <button class="text-xs text-blue-500 font-bold">READ <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // PUBLISH NOVEL
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const title = document.getElementById('novel-title').value;
            const syn = document.getElementById('novel-synopsis').value;
            if (!title || !syn) return alert("Fill up all fields!");

            await setDoc(doc(collection(db, "novels")), {
                title: title,
                synopsis: syn,
                authorName: currentUser.displayName,
                authorId: currentUser.uid,
                createdAt: new Date()
            });

            document.getElementById('novel-title').value = "";
            document.getElementById('novel-synopsis').value = "";
            alert("Novel Published to the Empire!");
        });
    </script>
</body>
</html>
